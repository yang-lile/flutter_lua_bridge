# Runs on GitHub Actions and on Gitea Actions (which reads .github/workflows
# when the repository has no .gitea/workflows).
name: Typed bridge (light)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: typed-bridge-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    name: Analyzer, generated files and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install a C compiler for the native asset hook
        run: |
          command -v clang >/dev/null && exit 0
          sudo=$(command -v sudo || true)
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends clang
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - run: ./tool/ci.sh light
