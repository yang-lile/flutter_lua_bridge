name: Typed bridge (light)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: typed-bridge-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang
      - run: ./tool/ci_light.sh

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - run: flutter test test/bridge/basic_bridge_test.dart test/game/card_loader_test.dart
        working-directory: example
