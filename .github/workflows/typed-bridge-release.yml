name: Typed bridge (release integration)
on:
  release:
    types: [published]
permissions:
  contents: read

concurrency:
  group: typed-bridge-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  ubuntu-integration:
    name: Ubuntu full integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true
      - run: flutter pub get
      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Run full integration gate
        run: ./tool/ci.sh
