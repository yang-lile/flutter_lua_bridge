name: flutter_lua_bridge_codegen
description: build_runner builders that generate typed Dart/Lua bindings and Teal declarations for flutter_lua_bridge, and compile Teal to Lua.
version: 0.2.0
homepage: https://github.com/yang-lile/flutter_lua_bridge
repository: https://github.com/yang-lile/flutter_lua_bridge

resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  analyzer: ^14.7.0
  build: ^5.0.0
  flutter_lua_bridge: ^0.2.0
  flutter_lua_bridge_codegen_annotation: ^0.2.0
  glob: ^2.2.0
  path: ^1.9.1
  source_gen: ^4.3.1

dev_dependencies:
  build_runner: ^2.17.1
  build_test: ^3.5.23
  flutter_lints: ^6.0.0
  test: ^1.32.0

topics:
  - lua
  - code-generation
