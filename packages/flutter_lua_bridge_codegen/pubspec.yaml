name: flutter_lua_bridge_codegen
description: build_runner builders that generate typed Dart/Lua bindings and Teal declarations for flutter_lua_bridge, and compile Teal to Lua.
version: 0.0.2
homepage: https://github.com/yang-lile/flutter_lua_bridge
repository: https://github.com/yang-lile/flutter_lua_bridge
publish_to: https://pub.dev

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  analyzer: ">=8.4.1 <11.0.0"
  build: ^4.0.0
  flutter_lua_bridge: ^0.0.2
  flutter_lua_bridge_codegen_annotation: ^0.0.2
  glob: ^2.1.2
  path: ^1.9.0
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.10.0
  build_test: ^3.5.0
  flutter_lints: ^6.0.0
  test: ^1.25.8

topics:
  - lua
  - code-generation
